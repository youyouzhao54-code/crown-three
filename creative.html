<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17120d"><title>创意模式 · 群雄棋局</title><link rel="stylesheet" href="./src/creative/styles.css"><link rel="stylesheet" href="./src/creative/interaction.css"><link rel="stylesheet" href="./src/creative/draft.css"></head>
<body>
  <main class="creative-shell">
    <header><a href="./index.html">← 返回主菜单</a><p>CREATIVE MODE · FRAMEWORK</p><h1>群雄棋局</h1><span>9×9 · 五子连珠 · 七阶棋子</span></header>
    <section id="role-select" class="draft-screen">
      <div class="draft-heading"><p>GENERAL DRAFT</p><h2>选择出阵武将</h2><span id="draft-prompt">先手玩家正在选择</span></div>
      <aside id="black-draft" class="draft-side black-side"></aside>
      <section class="draft-center">
        <div id="role-pool" class="role-pool" aria-label="武将池"></div>
        <button id="lock-role" class="lock-role">黑方确认武将</button>
      </section>
      <aside id="white-draft" class="draft-side white-side"></aside>
      <section id="role-detail" class="role-detail"></section>
    </section>
    <section id="creative-game" class="creative-game" hidden>
      <aside id="black-player" class="player black-player"></aside>
      <section class="war-table"><div id="creative-status" class="creative-status"></div><div id="creative-board" class="creative-board" aria-label="9乘9创意模式棋盘"></div><p class="board-hint">棋子落在横竖线交叉点 · 默认五枚顶层棋子连珠获胜 · 棋子等级上限为7</p></section>
      <aside id="white-player" class="player white-player"></aside>
      <div class="creative-controls"><div class="creative-modes"><button data-creative-mode="place">放置</button><button data-creative-mode="move">移动</button><button data-creative-mode="recycle">回收</button><button id="creative-skip" hidden>放弃追加行动</button><button id="zhangfei-skip" hidden>结束狂啸追加行动</button><button id="cao-skip" hidden>放弃第二次放置</button><button id="cao-abandon" hidden>归心：舍弃低阶手牌</button><button id="cao-promote" hidden>归心：五级升六级</button><button id="cao-tubu-five" hidden>吐哺：获得1枚5级</button><button id="cao-tubu-fours" hidden>吐哺：获得2枚4级</button><button id="lvbu-skip" hidden>不发动单三</button><button id="lvbu-pass" hidden>霸气不足，结束回合</button></div><div><button id="creative-audio">声音：开启</button><button id="creative-cancel">取消选择</button><button id="creative-restart">重新开始</button><button id="creative-change-role">更换武将</button><a href="./index.html">返回主菜单</a></div></div>
    </section>
  </main>
  <script type="module" src="./src/creative/app.js"></script>
</body></html>
